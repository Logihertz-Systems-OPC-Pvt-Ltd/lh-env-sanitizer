[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-env-sanitizer"
version = "0.1.0"
description = "Scans .env files, Kubernetes ConfigMaps, Docker environment blocks, and CI variable dumps using Shannon entropy and pattern matching to detect cleartext API keys, debug flags in production, and weak secrets; outputs redacted templates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "bandit>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-env-sanitizer"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-env-sanitizer"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-env-sanitizer#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-env-sanitizer/issues"

[project.scripts]
lh-env = "lh_env_sanitizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_env_sanitizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM", "ARG"]
ignore = ["ARG001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B104"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
